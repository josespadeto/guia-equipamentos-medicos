# Configuração do Site - Guia de Equipamentos Médicos
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "mint"

# Informações Gerais
title: "Guia de Equipamentos Médicos"
title_separator: "|"
subtitle: "Avaliação técnica, segurança e parâmetros clínicos em saúde domiciliar"
name: "Dr. José Ronaldo Spadeto"
description: "Portal pericial e informativo sobre suporte ventilatório, oxigenoterapia e tecnologia médica domiciliar."
url: "https://josespadeto.github.io"
baseurl: "/guia-equipamentos-medicos"

# Autor e Perfil Lateral
author:
  name: "Dr. José Ronaldo Spadeto"
  avatar: "/assets/images/logo-jrs.svg"
  bio: "Médico Perito. Avaliação técnica, conformidade de parâmetros e segurança no uso de equipamentos domiciliares."
  location: "Brasil"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/josespadeto"

# Configurações de Construção do Jekyll
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

# Plugins Suportados pelo GitHub Pages
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Padrões de Layout
defaults:
  # Posts do Blog
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # Páginas Institucionais
  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: "single"
      author_profile: true

# Configurações de Leitura e Sumário
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..3

# Navegação e Rodapé
include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
