# Welcome to Jekyll!
# Configurações do Portal de Equipamentos Médicos & Tecnologia Assistiva

# Site settings
title: "Guia de Equipamentos Médicos"
name: "Dr. José Ronaldo Spadeto"
email: ""
description: "Avaliação pericial independente, conformidade de parâmetros técnicos e critérios de segurança em equipamentos para cuidados domiciliares."
url: "https://josespadeto.github.io"
baseurl: "/guia-equipamentos-medicos"

# Identidade visual
minimal_mistakes_skin: "default"
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: "America/Sao_Paulo"

include:
  - _pages

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Barra Lateral do Especialista (E-E-A-T em estrita conformidade técnica e ética)
author:
  name   : "Dr. José Ronaldo Spadeto"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "Médico Perito. Avaliação técnica, conformidade de parâmetros e segurança no uso de equipamentos domiciliares."
  location: "Brasil"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/josespadeto"

# Rodapé Institucional
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/josespadeto"

# Configurações padrão de layout
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      toc: true
      toc_label: "Neste Artigo"
      toc_icon: "stethoscope"
      toc_sticky: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
