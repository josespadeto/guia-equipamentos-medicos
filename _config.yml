# Configuração do Site - Guia de Equipamentos Médicos (Tema Mediumish)
remote_theme: "wowthemesnet/mediumish-theme-jekyll"

# Metadados Principais
title: "Guia de Equipamentos Médicos"
name: "Dr. José Ronaldo Spadeto"
description: "Avaliação técnica, segurança e parâmetros clínicos em saúde domiciliar"
logo: "assets/images/logo-jrs.svg"
favicon: "assets/images/logo-jrs.svg"
baseurl: "/guia-equipamentos-medicos"
url: "https://josespadeto.github.io"

# Configuração de Autor (E-E-A-T)
author:
  name: "Dr. José Ronaldo Spadeto"
  avatar: "assets/images/logo-jrs.svg"
  bio: "Médico Perito. Especialista em avaliação técnica, conformidade de parâmetros e segurança no uso de equipamentos de saúde domiciliar."
  email: "contato@josespadeto.com.br"
  crm: "Registro Profissional Médico Ativo"

# Paginação e Formato de Posts
paginate: 6
paginate_path: "/page:num/"
permalink: /:categories/:title/

# Plugins Suportados pelo GitHub Pages
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Processamento Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Opções de Exibição do Mediumish
disqus: ""
mailchimp-list: ""
share: false

include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
