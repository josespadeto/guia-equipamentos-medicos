<!-- Início do Seletor de Idioma Google Tradutor -->
<div style="margin-top: 1.5em; padding-top: 1em; border-top: 1px solid rgba(0,0,0,0.1); text-align: center;">
  <span style="font-size: 0.85em; color: #64748b; margin-right: 8px; font-weight: 600;">Idioma / Language:</span>
  <div id="google_translate_element" style="display: inline-block;"></div>
</div>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'pt',
      includedLanguages: 'en,es,pt',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
      autoDisplay: false
    }, 'google_translate_element');
  }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<!-- Fim do Seletor de Idioma -->
